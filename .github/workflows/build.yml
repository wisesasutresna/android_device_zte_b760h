name: Build LineageOS 14.1 for ZTE B760H (all patches)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which image to build. `all` = boot + system + recovery'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - boot
          - system
          - recovery
  push:
    branches: [ main, lineage-14.1, fix/workflow-ci-build ]
  pull_request:
    branches: [ main, lineage-14.1 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      USE_CCACHE: 1
      # Must live outside /tmp and inside the cached path below. It used to be
      # /tmp/ccache, which is neither persisted nor even reachable by the
      # cache step - and the ccache binary was never installed, so USE_CCACHE=1
      # was a no-op and every run compiled from nothing.
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 5G
      MAKEFLAGS: "-j2"
      # Empty on push/pull_request, which means "all".
      BUILD_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
      SYSROOT_DIR: /home/runner/android/lineage
      # Android 7.1 uses Jack as the Java compiler, and Jack talks to its own
      # server over SSL. TLSv1/TLSv1.1 have been disabled by default since
      # JDK 8u291 and the runner ships 8.0.504, so the handshake fails:
      #   Jack server failed to (re)start, try 'jack-diagnose'
      #   SSL error when connecting to the Jack server
      # and the build dies with exit code 47.
      #
      # Two independent levers, because either alone may not be enough:
      #   - java.security.properties  lifts jdk.tls.disabledAlgorithms, which is
      #     a security-manager property rather than a plain -D, so it can only
      #     be reached through an override file.
      #   - jdk.tls.client.protocols pins the client to TLSv1.2, which has never
      #     been disabled, in case the override is not honoured.
      # Nothing else in this build uses Java TLS - git does its own - so this is
      # contained to Jack.
      _JAVA_OPTIONS: "-Djava.security.properties=/home/runner/tls-override.security -Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2"

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Allow legacy TLS for the Jack server
        run: |
          printf 'jdk.tls.disabledAlgorithms=\n' > /home/runner/tls-override.security
          echo "### override file"
          cat /home/runner/tls-override.security | sed 's/^/  /'
          echo ""
          echo "### java in use"
          java -version 2>&1 | sed 's/^/  /'
          echo ""
          echo "### does this JDK actually ignore TLSv1 now?"
          java -Xshowsettings:properties -version 2>&1 | grep -i tls | sed 's/^/  /' || true

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            bc schedtool libssl-dev liblz4-tool pngcrush \
            rsync ncurses-dev repo python3 python3-pip \
            libncurses5 libtinfo5 \
            python2 \
            ccache

          # LineageOS 14.1 host tooling is Python 2, including
          # build/tools/check_radio_versions.py:
          #   File "build/tools/check_radio_versions.py", line 56
          #     print "*** Error opening \"%s.sha1\"; can't verify %s" % (fn, key)
          #   SyntaxError: Missing parentheses in call to 'print'
          # Ubuntu 22.04 points `python` at Python 3, so point it back at 2.
          # Scripts that genuinely need 3 invoke python3 explicitly and are
          # unaffected by this.
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          echo "python is now: $(python --version 2>&1)"

      - name: Cache compiler objects (ccache)
        uses: actions/cache@v4
        with:
          # ccache hashes the preprocessed source and the compiler flags itself,
          # so a changed patch produces a different hash and misses on its own.
          # The key therefore stays deliberately stable across workflow edits -
          # tying it to hashFiles(build.yml) would throw the cache away on every
          # edit to this file, which is exactly when reuse is wanted most.
          # Bump the version by hand to force a cold cache.
          path: /home/runner/.ccache
          key: ccache-ubuntu2204-v1
          save-always: true

      - name: Reset ccache statistics
        run: |
          # Zero the counters so each run reports its own hits rather than a
          # running total since the cache was first created.
          ccache --zero-stats
          echo "### ccache state before the build"
          ccache --show-config | grep -E 'max_size|cache_dir' | sed 's/^/  /'
          ccache --show-stats | sed 's/^/  /'

      - name: Init and sync LineageOS repo (android)
        # Unconditional. This used to be skipped on a source-cache hit, but the
        # source tree is 30 GB against GitHub's 10 GB cache limit, so it could
        # never be cached and never was. See the ccache step for what is
        # persisted now instead.
        run: |
          # Without pipefail this step reports tail's exit code, so a failed
          # repo sync is reported as a success and the next step dies with a
          # misleading "source tree is incomplete" error.
          set -o pipefail
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1 --depth=1
          repo sync -c -j4 --force-sync --force-broken 2>&1 | tee /tmp/repo-sync.log

      - name: Report runner capacity
        run: |
          echo "### CPU"
          echo "  nproc:  $(nproc)"
          echo "  MAKEFLAGS: $MAKEFLAGS"
          echo ""
          echo "### Memory"
          free -h | sed 's/^/  /'
          echo ""
          echo "### Filesystem"
          df -h / | sed 's/^/  /'
          echo ""
          echo "### Source tree size (after sync)"
          du -sh "$SYSROOT_DIR" 2>/dev/null | sed 's/^/  /' || echo "  (not present)"
          echo ""
          echo "### Build tree size"
          du -sh "$SYSROOT_DIR/out" 2>/dev/null | sed 's/^/  /' || echo "  (no out/ yet)"
          du -sh "$SYSROOT_DIR/out/host" 2>/dev/null | sed 's/^/    out/host /' || true
          du -sh "$SYSROOT_DIR/out/target" 2>/dev/null | sed 's/^/    out/target /' || true
          echo ""
          echo "### ccache"
          du -sh "$CCACHE_DIR" 2>/dev/null | sed 's/^/  /' || echo "  (empty)"
          echo ""
          echo "Recorded so out/ and ccache sizes stop being guesses. A GitHub-hosted"
          echo "ubuntu-22.04 runner is 2 vCPU / 7 GB, so MAKEFLAGS=-j2 is deliberate;"
          echo "raising it there would risk OOM without gaining cores."

      - name: Copy device tree
        run: |
          mkdir -p ~/android/lineage/device/zte/b760h
          cp -r ${{ github.workspace }}/* ~/android/lineage/device/zte/b760h/
          rm -rf ~/android/lineage/device/zte/b760h/.git

          # This repo bundles vendor/ inside the device tree, but LineageOS
          # expects vendor/ at the root of the source tree:
          #   device/zte/b760h/device.mk -> VENDOR_PATH := vendor/zte/b760h
          #   device/zte/b760h/b760h-vendor.mk -> PRODUCT_COPY_FILES
          #                                        vendor/zte/b760h/proprietary/...
          # Without this the build looks for ~/android/lineage/vendor/zte/b760h
          # and fails with: "vendor/zte/b760h/b760h-vendor.mk" does not exist.
          #
          # The nested copy is deliberately left in place: all-subdir-makefiles
          # in device/zte/b760h/Android.mk has to find vendor/zte/b760h/Android.mk
          # for the libdpframework prebuilt module.
          mkdir -p ~/android/lineage/vendor/zte
          cp -a ~/android/lineage/device/zte/b760h/vendor/zte/b760h \
                ~/android/lineage/vendor/zte/

      - name: Apply all patches
        run: |
          cd ~/android/lineage
          PATCH_COUNT=0
          PATCH_FAILED=0
          PATCH_SKIPPED=0

          for patchfile in $(find device/zte/b760h/patches -name "*.patch" -type f | sort); do
            PATCH_COUNT=$((PATCH_COUNT + 1))
            rel_path="${patchfile#device/zte/b760h/patches/}"
            target_dir="$(dirname "$rel_path")"

            if [ -n "$target_dir" ] && [ ! -d "$target_dir" ]; then
              echo "⚠️  SKIPPED: Target directory does not exist: $target_dir (patch: $rel_path)"
              PATCH_SKIPPED=$((PATCH_SKIPPED + 1))
              continue
            fi

            if [ -n "$target_dir" ]; then
              PATCH_DIR="$target_dir"
            else
              PATCH_DIR="."
            fi

            echo "📋 Applying patch [$PATCH_COUNT]: $rel_path in $PATCH_DIR"
            echo "$PATCH_DIR" >> /tmp/patched-dirs.txt
            if ! patch -p1 --no-backup-if-mismatch -r - -d "$PATCH_DIR" < "$patchfile"; then
              echo "❌ FAILED: Patch $rel_path failed to apply in $PATCH_DIR"
              echo "   Attempting to apply with -p0..."
              if ! patch -p0 --no-backup-if-mismatch -r - -d "$PATCH_DIR" < "$patchfile"; then
                PATCH_FAILED=$((PATCH_FAILED + 1))
                echo "   Still failed with -p0. Stopping."
                break
              else
                echo "✓ Applied with -p0"
              fi
            else
              echo "✓ Applied successfully"
            fi
          done

          echo ""
          echo "========================================="
          echo "Patch Summary:"
          echo "  Total:   $PATCH_COUNT"
          echo "  Failed:  $PATCH_FAILED"
          echo "  Skipped: $PATCH_SKIPPED"
          echo "========================================="

          if [ $PATCH_FAILED -gt 0 ]; then
            exit 1
          fi

      - name: Clean patch artefacts
        run: |
          # GNU patch writes <file>.orig next to every file it modifies with an
          # offset or with fuzz. --no-backup-if-mismatch does NOT suppress that;
          # it only suppresses backups on outright mismatch. Verified locally:
          #   $ patch -p1 -t < t.patch
          #     Hunk #1 succeeded at 1 with fuzz 1.
          #     artefak: ./f.txt.orig
          #
          # Those leftovers are fatal, not cosmetic. frameworks/base/0006 lands
          # its strings.xml hunk with a 63-line offset, leaving
          # core/res/res/values/strings.xml.orig next to strings.xml. aapt2 then
          # compiles both, and the build dies with dozens of:
          #   error: Resource entry work_mode_off_title is already defined.
          #
          # Scoped to the directories that were patched, so nothing else in the
          # tree is touched.
          cd ~/android/lineage
          echo "### Patched directories"
          sort -u /tmp/patched-dirs.txt | sed 's/^/  /'
          echo ""
          echo "### .orig / .rej files left behind"
          : > /tmp/patch-artifacts.txt
          while read -r d; do
            [ -d "$d" ] || continue
            find "$d" -type f \( -name '*.orig' -o -name '*.rej' \) -print >> /tmp/patch-artifacts.txt
          done < <(sort -u /tmp/patched-dirs.txt)
          TOTAL=$(wc -l < /tmp/patch-artifacts.txt)
          echo "  found: $TOTAL"
          if [ "$TOTAL" -gt 0 ]; then
            sort /tmp/patch-artifacts.txt | head -40 | sed 's/^/    /'
            [ "$TOTAL" -gt 40 ] && echo "    ... and $((TOTAL - 40)) more"
            xargs -r rm -f < /tmp/patch-artifacts.txt
          fi
          echo ""
          echo "### Remaining after cleanup"
          LEFT=0
          while read -r d; do
            [ -d "$d" ] || continue
            LEFT=$((LEFT + $(find "$d" -type f \( -name '*.orig' -o -name '*.rej' \) -print | wc -l)))
          done < <(sort -u /tmp/patched-dirs.txt)
          echo "  $LEFT"
          # Written as an if, not as `[ "$LEFT" -ne 0 ] && exit 1`. That form
          # was the last command in this step, so when the test was false the
          # script exited with status 1 and the step was reported as failed
          # even though the tree was clean. Runs #24 and #25 both failed here
          # with "found: 0 / remaining: 0".
          if [ "$LEFT" -ne 0 ]; then
            echo "::error::patch artefacts survived cleanup"
            exit 1
          fi
          echo "  tree is clean"

      - name: Pre-build resource java that Jack waits on
        run: |
          cd "$SYSROOT_DIR"
          source build/envsetup.sh
          lunch lineage_b760h-userdebug
          set -o pipefail

          # org.cyanogenmod.platform.internal is a java_library whose source
          # references org.cyanogenmod.platform-res. Jack is handed the
          # generated R.java / Manifest.java as explicit file arguments, so it
          # dies if they are not there yet:
          #
          #   4 errors during configuration. Try --help-properties for help.
          #     Property 'jack.source' (in Options): element #1: file
          #     '.../org.cyanogenmod.platform-res_intermediates/src/.../Manifest.java'
          #     does not exist
          #
          # This is not a race. Run #28 compiled 12221 edges over 40 minutes
          # and the files still were not there, and the two retries then failed
          # within seconds. The res module is never scheduled, so the files are
          # never produced at any point in the build.
          #
          # Build it explicitly first. mka <module> works for java modules
          # because the build emits a phony target per module name.
          echo "### Building org.cyanogenmod.platform-res explicitly"
          mka org.cyanogenmod.platform-res 2>&1 | tee /tmp/preres-build.log | tail -25

          echo ""
          echo "### Where did the generated java land?"
          FOUND=0
          for p in \
            out/target/common/obj/APPS/org.cyanogenmod.platform-res_intermediates/src/cyanogenmod/platform/R.java \
            out/target/common/obj/APPS/org.cyanogenmod.platform-res_intermediates/src/cyanogenmod/platform/Manifest.java \
            out/target/common/obj/JAVA_LIBRARIES/org.cyanogenmod.platform-res_intermediates/src/cyanogenmod/platform/R.java \
            out/target/common/obj/JAVA_LIBRARIES/org.cyanogenmod.platform-res_intermediates/src/cyanogenmod/platform/Manifest.java
          do
            if [ -f "$p" ]; then
              echo "  FOUND  $p"
              FOUND=1
            else
              echo "  absent $p"
            fi
          done

          echo ""
          echo "### ninja targets that mention the module"
          ninja -C out -t targets all 2>/dev/null | grep -i 'org.cyanogenmod.platform-res' | head -12 || true
          echo "  (empty means the module genuinely has no ninja target)"

          echo ""
          echo "### did the .apk get produced?"
          find out -name 'org.cyanogenmod.platform-res*.apk' 2>/dev/null | head -5 || true

          if [ "$FOUND" -eq 0 ]; then
            echo "::warning::platform-res generated java still absent after an explicit build - the next step will fail and the log above explains why"
          else
            echo "platform-res generated java is present, continuing"
          fi

      - name: Setup build environment
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          lunch lineage_b760h-userdebug
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"

      - name: Build boot image
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == 'boot'
        run: |
          set -o pipefail
          cd "$SYSROOT_DIR"
          source build/envsetup.sh
          lunch lineage_b760h-userdebug
          mka bootimage 2>&1 | tee /tmp/bootimage-build.log

      - name: Upload boot image immediately
        if: (env.BUILD_TARGET == 'all' || env.BUILD_TARGET == 'boot') && always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-image-b760h
          path: /home/runner/android/lineage/out/target/product/b760h/boot.img
          if-no-files-found: ignore
          retention-days: 7

      - name: Build system image
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == 'system'
        run: |
          set -o pipefail
          cd "$SYSROOT_DIR"
          source build/envsetup.sh
          lunch lineage_b760h-userdebug

          # cm-14.1 never schedules org.cyanogenmod.platform-res, so the R.java
          # that the Jack compile of org.cyanogenmod.platform.internal needs is
          # not produced at any point. "Pre-build resource java that Jack waits
          # on" builds it explicitly ahead of time.
          #
          # A bounded rerun is still kept as a cheap safety net: ninja replays
          # only failed edges, so a second pass costs seconds when there is
          # genuinely nothing left to do. It is not the fix for this failure -
          # retries were tried in run #28 and did not help.
          for attempt in 1 2 3; do
            echo "### systemimage attempt $attempt of 3"
            if mka systemimage 2>&1 | tee /tmp/systemimage-build.log; then
              echo "### systemimage built on attempt $attempt"
              exit 0
            fi
            if ! grep -q "Property 'jack.source' (in Options)" /tmp/systemimage-build.log; then
              echo "::error::systemimage failed for a reason unrelated to the Jack race - not retrying"
              exit 1
            fi
            echo "### platform-res java still missing on attempt $attempt, retrying"
            sleep 10
          done
          echo "::error::systemimage still failing after 3 attempts"
          echo "--- see the 'Pre-build resource java' step for where the file actually landed ---"
          exit 1

      - name: Build recovery image
        # None of the 29 patches modifies recovery, so it is opt-in rather than
        # part of `all`. Building it otherwise costs real time for an unchanged
        # image.
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == 'recovery'
        run: |
          set -o pipefail
          cd "$SYSROOT_DIR"
          source build/envsetup.sh
          lunch lineage_b760h-userdebug
          mka recoveryimage 2>&1 | tee /tmp/recoveryimage-build.log

      - name: Build userdata and cache images
        # board.mk sizes these to the real partitions (userdata 1 GB, cache
        # 753 MB) and makes them ext4, but neither is part of droidcore, so
        # `mka` never produces them. They are the only way to reach a fresh
        # install by flashing instead of wiping from recovery: boot,
        # recovery and system all leave /data and /cache untouched, which is
        # why an unchanged flash still carries the previous ROM's data.
        #
        # Opt-in like recovery - both are just empty filesystems and cost real
        # time for an image nobody wants.
        if: env.BUILD_TARGET == 'all'
        run: |
          set -o pipefail
          cd "$SYSROOT_DIR"
          source build/envsetup.sh
          lunch lineage_b760h-userdebug
          mka userdataimage cacheimage 2>&1 | tee /tmp/usercache-build.log

      - name: Collect Jack diagnostics
        if: always()
        run: |
          set +e
          OUT=/tmp/jack-diagnostics.txt
          {
            echo "=== Jack state before the build ==="
            echo "--- jack-admin path ---"
            ls -l "$SYSROOT_DIR/prebuilts/sdk/tools/jack-admin" 2>&1
            echo ""
            echo "--- jack jars present? ---"
            ls -1 "$SYSROOT_DIR/prebuilts/sdk/tools/" 2>&1 | grep -i jack | head -30
            echo ""
            echo "--- jack-diagnose ---"
            "$SYSROOT_DIR/prebuilts/sdk/tools/jack-diagnose" 2>&1 | head -60
            echo ""
            echo "--- ~/.jack-server contents ---"
            ls -la "$HOME/.jack-server" 2>&1
            echo ""
            echo "--- ~/.jack-settings ---"
            cat "$HOME/.jack-settings" 2>&1
          } > "$OUT" 2>&1
          cp "$OUT" /tmp/jack-diagnostics-pre.txt 2>/dev/null
          sed 's/^/  /' "$OUT"
          exit 0

      - name: Report ccache hit rate
        if: always()
        run: |
          echo "### ccache after the build"
          ccache --show-stats | sed 's/^/  /'

      - name: Collect Jack logs
        if: failure()
        run: |
          set +e
          # The Jack server writes its own log, and the build message says to
          # look there. Without this the actual reason for exit 47 is never in
          # the job log, only "SSL error when connecting to the Jack server".
          mkdir -p /tmp/jack-logs
          for f in "$HOME/.jack-server"/*.log "$HOME"/.jack*.log; do
            [ -f "$f" ] && cp "$f" /tmp/jack-logs/ 2>/dev/null
          done
          {
            echo "### Jack server logs"
            ls -la /tmp/jack-logs
            for f in /tmp/jack-logs/*; do
              [ -f "$f" ] || continue
              echo ""
              echo "--- $f (last 80 lines) ---"
              tail -80 "$f"
            done
          } > /tmp/jack-logs.txt 2>&1
          sed 's/^/  /' /tmp/jack-logs.txt | head -120

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-run${{ github.run_number }}
          path: |
            /tmp/*-build.log
            /tmp/repo-sync.log
            /tmp/jack-logs.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload system image immediately
        if: (env.BUILD_TARGET == 'all' || env.BUILD_TARGET == 'system') && always()
        uses: actions/upload-artifact@v4
        with:
          name: system-image-b760h
          path: /home/runner/android/lineage/out/target/product/b760h/system.img
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload recovery image immediately
        if: (env.BUILD_TARGET == 'all' || env.BUILD_TARGET == 'recovery') && always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-image-b760h
          path: /home/runner/android/lineage/out/target/product/b760h/recovery.img
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload userdata image immediately
        if: env.BUILD_TARGET == 'all' && always()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-image-b760h
          path: /home/runner/android/lineage/out/target/product/b760h/userdata.img
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload cache image immediately
        if: env.BUILD_TARGET == 'all' && always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-image-b760h
          path: /home/runner/android/lineage/out/target/product/b760h/cache.img
          if-no-files-found: ignore
          retention-days: 7

      - name: Report produced images
        if: always()
        run: |
          OUT="$SYSROOT_DIR/out/target/product/b760h"
          echo "### images present in $OUT"
          for img in boot system recovery userdata cache; do
            if [ -f "$OUT/$img.img" ]; then
              echo "  $img.img  $(du -h "$OUT/$img.img" | cut -f1)"
            else
              echo "  $img.img  not built by this run"
            fi
          done
          echo ""
          echo "userdata.img and cache.img are sparse. `dd` cannot write them:"
          echo "  simg2img userdata.img userdata.raw.img && dd if=userdata.raw.img of=/dev/block/mmcblk0p6"
          echo "  simg2img cache.img   cache.raw.img   && dd if=cache.raw.img   of=/dev/block/mmcblk0p7"
